<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Friendly Poster — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink-bg: #0B0E13;
      --ink-bg-2: #10141C;
      --paper: #F6F1E3;
      --paper-dim: #ECE4D0;
      --ink: #1E1811;
      --ink-soft: #4A4030;
      --on-dark: #E9E3D2;
      --on-dark-muted: rgba(233, 227, 210, .48);
      --rule: rgba(30, 24, 17, .14);
      --rule-onDark: rgba(233, 227, 210, .13);
      --press: #1D6E96;
      --press-bright: #2F93C7;
      --brass: #C9932E;
      --brass-bright: #E6B23E;
      --success: #2F7D52;
      --success-soft: rgba(47, 125, 82, .12);
      --danger: #A83232;
      --danger-soft: rgba(168, 50, 50, .12);
      --pending: #9C7A24;
      --pending-soft: rgba(180, 132, 30, .14);
      --sbw: 276px;
      --shadow: 0 2px 0 rgba(0, 0, 0, .04), 0 10px 24px rgba(20, 14, 8, .3);
      --shadow-lift: 0 4px 0 rgba(0, 0, 0, .05), 0 22px 40px rgba(20, 14, 8, .4);
    }

    * {
      box-sizing: border-box;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    ::selection {
      background: var(--press);
      color: var(--paper);
    }

    html {
      background: var(--ink-bg);
    }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 620px at 90% -10%, rgba(29, 110, 150, .09), transparent 55%),
        radial-gradient(900px 500px at -8% 106%, rgba(201, 147, 46, .08), transparent 55%),
        repeating-radial-gradient(circle at 0 0, rgba(233, 227, 210, .025) 0, rgba(233, 227, 210, .025) 1px, transparent 1px, transparent 5px),
        var(--ink-bg);
      color: var(--on-dark);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sbw);
      flex-shrink: 0;
      background: linear-gradient(180deg, #0D1017 0%, #0A0D12 100%);
      color: var(--on-dark);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100vh;
      border-right: 1px solid var(--rule-onDark);
    }

    .sb-top {
      flex-shrink: 0;
      padding: 22px 14px 0;
    }

    .sb-bottom {
      flex-shrink: 0;
      padding: 10px 14px 18px;
    }

    .site-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 10px 10px;
    }

    .site-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .site-scroll::-webkit-scrollbar-thumb {
      background: rgba(201, 147, 46, .3);
      border-radius: 6px;
    }

    .brand {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: 18px;
      line-height: 1.08;
      text-transform: uppercase;
      letter-spacing: .003em;
      padding: 3px 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand .mark {
      width: 30px;
      height: 30px;
      border-radius: 3px;
      flex-shrink: 0;
      background: var(--press);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--paper);
      transform: rotate(-3deg);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, .35);
    }

    /* Signature element: scrolling wire-service ticker, evokes a teletype feed */
    .wire-ticker {
      overflow: hidden;
      white-space: nowrap;
      background: rgba(201, 147, 46, .1);
      border-top: 1px solid var(--rule-onDark);
      border-bottom: 1px solid var(--rule-onDark);
      margin: 0 -14px 16px;
      padding: 6px 0;
    }

    .wire-ticker-track {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .1em;
      color: var(--brass-bright);
      animation: ticker 22s linear infinite;
      padding-left: 100%;
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .nav-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--on-dark-muted);
      padding: 12px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-label .chip {
      background: rgba(233, 227, 210, .08);
      color: var(--on-dark);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      padding: 1px 7px;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .search-wrap {
      position: relative;
      padding: 0 8px 10px;
    }

    .search-wrap svg {
      position: absolute;
      left: 19px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .4;
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      background: rgba(233, 227, 210, .04);
      border: 1px solid var(--rule-onDark);
      color: var(--on-dark);
      font-size: 13px;
      padding: 8px 10px 8px 30px;
      border-radius: 5px;
      transition: border-color .15s, background .15s;
    }

    .search-wrap input::placeholder {
      color: var(--on-dark-muted);
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--brass);
      background: rgba(233, 227, 210, .06);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      color: rgba(233, 227, 210, .72);
      font-size: 13.5px;
      font-weight: 500;
      text-transform: capitalize;
      padding: 8px 10px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      transition: background .15s, color .15s;
      margin-bottom: 1px;
    }

    .nav-item:hover {
      background: rgba(233, 227, 210, .045);
      color: var(--on-dark);
    }

    .nav-item.active {
      background: rgba(29, 110, 150, .13);
      color: var(--paper);
      border-left-color: var(--press);
    }

    .nav-item .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .9;
    }

    .nav-item span.t {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .nav-item.add {
      color: var(--brass-bright);
      font-weight: 700;
      margin-top: 6px;
    }

    .nav-item.add:hover {
      background: rgba(201, 147, 46, .12);
    }

    /* Site actively being generated/published - live highlight in the sidebar */
    .nav-item.posting {
      background: rgba(47, 125, 82, .15);
      border-left-color: var(--success);
      color: var(--paper);
    }

    .posting-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      animation: postingPulse 1.1s ease-in-out infinite;
    }

    @keyframes postingPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .35;
        transform: scale(.7);
      }
    }

    /* Live "posting now" banner on the dashboard's Auto-posting section */
    .live-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      padding: 10px 15px;
      border-radius: 6px;
      background: var(--success-soft);
      border: 1px solid rgba(47, 125, 82, .35);
      border-left: 3px solid var(--success);
      color: var(--success);
      font-size: 13.5px;
      font-weight: 600;
      animation: bannerFadeIn .25s ease-out;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      box-shadow: 0 0 0 rgba(47, 125, 82, .5);
      animation: liveDotPulse 1.4s ease-out infinite;
    }

    @keyframes liveDotPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(47, 125, 82, .5);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(47, 125, 82, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(47, 125, 82, 0);
      }
    }

    @keyframes bannerFadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 21px;
      height: 21px;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }

    .empty-nav {
      font-size: 12px;
      color: var(--on-dark-muted);
      padding: 10px 10px;
      font-style: italic;
    }

    .sb-footer {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--on-dark-muted);
      padding-top: 10px;
      border-top: 1px solid var(--rule-onDark);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--on-dark-muted);
      flex-shrink: 0;
    }

    .dot.ok {
      background: var(--success);
      box-shadow: 0 0 5px var(--success);
    }

    .dot.bad {
      background: var(--press);
    }

    .content {
      margin-left: var(--sbw);
      flex: 1;
      padding: 44px 48px 90px;
      max-width: 980px;
    }

    .view {
      animation: in .3s ease;
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--brass-bright);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow::before {
      content: '';
      width: 16px;
      height: 1px;
      background: var(--brass-bright);
    }

    h1 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 800;
      font-size: 44px;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: .005em;
      line-height: 1;
      color: var(--paper);
    }

    .sub {
      color: var(--on-dark-muted);
      font-size: 14px;
      margin: 10px 0 0;
      word-break: break-all;
    }

    .stitle {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 0 4px;
      color: var(--paper);
      letter-spacing: .01em;
    }

    .shint {
      color: var(--on-dark-muted);
      font-size: 13px;
      margin: 0 0 16px;
      max-width: 64ch;
    }

    section {
      margin-bottom: 40px;
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 8px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: var(--paper);
      border-radius: 6px;
      padding: 18px 18px 15px;
      box-shadow: var(--shadow);
      position: relative;
      color: var(--ink);
      transition: transform .18s ease;
    }

    /* Crop-mark corners, a nod to print production marks */
    .stat-card::before,
    .stat-card::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--c, var(--press));
      opacity: .55;
    }

    .stat-card::before {
      top: 6px;
      left: 6px;
      border-right: none;
      border-bottom: none;
    }

    .stat-card::after {
      bottom: 6px;
      right: 6px;
      border-left: none;
      border-top: none;
    }

    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-card b {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 30px;
      font-weight: 700;
      display: block;
      color: var(--ink);
    }

    .stat-card span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--ink-soft);
    }

    .row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px dashed var(--rule);
      transition: background .15s;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row b {
      font-size: 14px;
      color: var(--ink);
    }

    .row .meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    /* Status badges styled like ink rubber-stamps on a document */
    .badge {
      display: inline-flex;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1.5px solid currentColor;
      white-space: nowrap;
      transform: rotate(-1deg);
    }

    .badge.pending {
      color: var(--pending);
      background: var(--pending-soft);
    }

    .badge.generated {
      color: var(--brass);
      background: rgba(201, 147, 46, .1);
    }

    .badge.posted {
      color: var(--success);
      background: var(--success-soft);
    }

    .badge.failed {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* SEO % score chip - same rubber-stamp language as .badge, colour-graded
       green/amber/red by score so it's scannable at a glance across a list. */
    .seo-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .03em;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1.5px solid currentColor;
      white-space: nowrap;
      cursor: default;
    }

    .seo-badge.good {
      color: var(--success);
      background: var(--success-soft);
    }

    .seo-badge.ok {
      color: var(--pending);
      background: var(--pending-soft);
    }

    .seo-badge.bad {
      color: var(--danger);
      background: var(--danger-soft);
    }

    /* Category tag - shows which target category a post belongs to, coloured
       per-site so the same category across the list is visually consistent. */
    .cat-tag {
      display: inline-flex;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 3px;
      background: var(--paper-dim);
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      white-space: nowrap;
    }

    form.g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .full {
      grid-column: 1/-1;
    }

    label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 5px;
      display: block;
    }

    input,
    select {
      width: 100%;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      padding: 10px 12px;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: #FCFAF3;
      color: var(--ink);
      transition: border-color .15s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--press);
    }

    .inline-btn {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .inline-btn input {
      flex: 1;
    }

    /* Tactile, letterpress-style buttons - a solid "lever" you can press */
    button {
      font-size: 13px;
      font-weight: 700;
      border-radius: 5px;
      border: 1px solid transparent;
      padding: 10px 16px;
      cursor: pointer;
      background: var(--ink);
      color: var(--paper);
      box-shadow: 0 3px 0 #000;
      transition: transform .08s, box-shadow .08s, opacity .15s;
    }

    button:hover {
      opacity: .92;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #000;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    button.accent {
      background: var(--press);
      color: var(--paper);
      box-shadow: 0 3px 0 #7A2114;
    }

    button.secondary {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--rule);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
    }

    button.danger-outline {
      background: var(--paper);
      color: var(--danger);
      border-color: rgba(168, 50, 50, .3);
      box-shadow: 0 3px 0 rgba(168, 50, 50, .18);
    }

    button.small {
      padding: 5px 11px;
      font-size: 11.5px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
    }

    button.small:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 rgba(0, 0, 0, .35);
    }

    .spin {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -1px;
      margin-right: 6px;
    }

    button.secondary .spin,
    button.danger-outline .spin {
      border-color: rgba(30, 24, 17, .25);
      border-top-color: var(--ink);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(233, 227, 210, .06) 25%, rgba(233, 227, 210, .13) 37%, rgba(233, 227, 210, .06) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    .empty {
      text-align: center;
      padding: 42px 20px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    a.link {
      color: var(--press);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    a.link:hover {
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: calc(var(--sbw) + 22px);
      background: var(--ink);
      color: var(--paper);
      padding: 11px 18px;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .toast.error {
      background: var(--danger);
    }

    @media (max-width:860px) {
      :root {
        --sbw: 0px;
      }

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .app {
        flex-direction: column;
      }

      .content {
        margin-left: 0;
        padding: 26px 18px 60px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      form.g2 {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }

      .toast {
        left: 50%;
        transform: translateX(-50%) translateY(8px);
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sb-top">
        <div class="brand"><span class="mark">S</span>SEO Friendly Poster</div>
        <div class="wire-ticker" aria-hidden="true">
          <div class="wire-ticker-track">  SCRAPE · REWRITE · SEO OPTIMIZE · PUBLISH    RANK READY · 24/7 AUTOMATED
            FEED    SCRAPE · REWRITE · SEO OPTIMIZE · PUBLISH    RANK READY · 24/7 AUTOMATED FEED   </div>
        </div>
        <button class="nav-item" data-v="dashboard" onclick="nav('dashboard')">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg></span>
          <span class="t">Dashboard</span>
        </button>
        <button class="nav-item add" data-v="add-site" onclick="newSite()">
          <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.4">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8v8M8 12h8" />
            </svg></span>
          <span class="t">Add website</span>
        </button>
        <div class="nav-label">Websites <span class="chip" id="siteCount">0</span></div>
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input id="siteSearch" placeholder="Search websites…" oninput="renderSiteNav()" />
        </div>
      </div>

      <div class="site-scroll" id="siteNav"></div>

      <div class="sb-bottom">
        <div class="sb-footer"><span class="dot" id="sDot"></span><span id="sText">checking…</span></div>
        <div class="sb-footer" style="border-top:none; padding-top:4px;" id="countdownLine"></div>
        <div class="sb-footer" style="border-top:none; padding-top:4px;">
          <button class="secondary small" style="color : white; width:100%;" onclick="logout()">Log out</button>
        </div>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const API = '/api';
    const state = { sites: [], posts: [], view: 'dashboard', siteId: null, ready: false, busy: {}, nextRunAt: null, paused: false, currentSiteId: null, currentSiteName: null, editingSiteId: null };

    // Kept in sync with lib/regions.js on the backend - only used to build the
    // dropdown; the backend re-resolves the region itself from site.sourceRegion.
    const REGIONS = [
      { code: 'GLOBAL', label: 'Global' },
      { code: 'IN', label: 'India' },
      { code: 'US', label: 'USA' },
      { code: 'AE', label: 'Middle East (UAE)' },
      { code: 'SA', label: 'Saudi Arabia' },
      { code: 'GB', label: 'UK' },
      { code: 'CA', label: 'Canada' },
      { code: 'AU', label: 'Australia' },
      { code: 'SG', label: 'Singapore' },
      { code: 'ZA', label: 'South Africa' },
      { code: 'NG', label: 'Nigeria' },
      { code: 'PK', label: 'Pakistan' },
      { code: 'BD', label: 'Bangladesh' },
      { code: 'MY', label: 'Malaysia' },
      { code: 'PH', label: 'Philippines' },
      { code: 'IE', label: 'Ireland' },
      { code: 'NZ', label: 'New Zealand' },
      { code: 'KE', label: 'Kenya' },
    ];

    const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
    const isUrlLike = (s) => /^https?:\/\//i.test((s || '').trim());
    function toast(msg, err) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
      setTimeout(() => t.className = 'toast', 2600);
    }
    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      if (res.status === 401) { window.location.href = '/login.html'; throw new Error('Not authenticated'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function logout() {
      try { await fetch(API + '/auth/logout', { method: 'POST' }); } catch { }
      window.location.href = '/login.html';
    }
    function badge(s) {
      const l = { pending: 'Pending', generated: 'Ready to publish', posted: 'Published', failed: 'Failed' };
      return `<span class="badge ${s}">${l[s] || s}</span>`;
    }
    // SEO % chip - green 80%+, amber 50-79%, red <50%. Hovering shows exactly
    // which checklist items failed (see lib/seoScorer.js), not just the number.
    function seoBadge(p) {
      if (p.seoScore === null || p.seoScore === undefined) return '';
      const tier = p.seoScore >= 80 ? 'good' : p.seoScore >= 50 ? 'ok' : 'bad';
      const failed = (p.seoChecks || []).filter(c => !c.passed).map(c => '✕ ' + c.label);
      const title = failed.length ? esc(failed.join('\n')) : 'All on-page SEO checks passed';
      return `<span class="seo-badge ${tier}" title="${title}">SEO ${p.seoScore}%</span>`;
    }
    // Small tag showing which target category this post's site publishes into -
    // colour comes from hashColor(site.name) so it lines up visually with the
    // site's avatar colour elsewhere in the dashboard.
    function catTag(site) {
      if (!site) return '';
      const name = site.targetCategoryName || 'Uncategorized';
      return `<span class="cat-tag" style="border-color:${hashColor(site.name)}; color:${hashColor(site.name)}">${esc(name)}</span>`;
    }
    function hashColor(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
      return `hsl(${Math.abs(h) % 360}, 60%, 48%)`;
    }
    function initials(name) { return (name || '?').trim().slice(0, 1).toUpperCase(); }
    // Shows which day/time a post is at its current stage in, e.g. "Posted · 21 Jul, 3:45 PM"
    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      const datePart = dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
      const timePart = dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      return `${datePart}, ${timePart}`;
    }
    function postDateLabel(p) {
      if (p.status === 'posted') return `Posted · ${fmtDate(p.updatedAt)}`;
      if (p.status === 'generated') return `Generated · ${fmtDate(p.updatedAt)}`;
      if (p.status === 'seo_review_required') return `SEO review needed (${p.seoScore ?? '?'}%) · ${fmtDate(p.updatedAt)}`;
      if (p.status === 'failed') return `Failed · ${fmtDate(p.updatedAt)}`;
      return `Added · ${fmtDate(p.createdAt)}`;
    }
    function spinBtn(label) { return `<span class="spin"></span>${label}`; }

    async function loadStatus() {
      try {
        const s = await api('/status');
        state.nextRunAt = s.nextRunAt ? new Date(s.nextRunAt) : null;
        state.paused = !!s.paused;
        const changed = state.currentSiteId !== (s.currentSiteId || null);
        state.currentSiteId = s.currentSiteId || null;
        state.currentSiteName = s.currentSiteName || null;
        if (changed) { renderSiteNav(); if (state.view === 'dashboard') render(); }
      } catch { state.nextRunAt = null; }
    }
    // Poll status regularly so the "posting now" highlight in the sidebar stays live
    // even if the user doesn't click anything. Note: this polling is just for
    // display - closing/reloading this tab does NOT stop auto-posting anymore.
    setInterval(loadStatus, 4000);
    function tickCountdown() {
      const el = document.getElementById('countdownLine');
      if (!el) return;
      if (state.paused) { el.textContent = '⏸ Auto-posting stopped'; return; }
      if (!state.nextRunAt) { el.textContent = ''; return; }
      const diff = state.nextRunAt - new Date();
      if (diff <= 0) { el.textContent = '⏳ Checking now…'; loadStatus(); return; }
      const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
      el.textContent = `⏱ Next auto-check in ${m}m ${s.toString().padStart(2, '0')}s`;
    }
    setInterval(tickCountdown, 1000);

    async function startPosting() {
      state.busy['worker'] = true; render();
      try {
        const r = await api('/worker/start', { method: 'POST' });
        state.paused = r.paused;
        toast('Auto-posting started');
      }
      catch (e) { toast(e.message, true); }
      state.busy['worker'] = false; await loadStatus(); render();
    }
    async function stopPosting() {
      state.busy['worker'] = true; render();
      try { const r = await api('/worker/stop', { method: 'POST' }); state.paused = r.paused; toast('Auto-posting stopped'); }
      catch (e) { toast(e.message, true); }
      state.busy['worker'] = false; await loadStatus(); render();
    }

    async function loadSites() {
      try {
        state.sites = await api('/sites');
        document.getElementById('sDot').className = 'dot ok';
        document.getElementById('sText').textContent = 'connected';
      } catch { document.getElementById('sDot').className = 'dot bad'; document.getElementById('sText').textContent = 'not reachable'; }
      renderSiteNav();
    }
    async function loadPosts(siteId) {
      try { state.posts = await api('/posts' + (siteId ? `?siteId=${siteId}` : '')); }
      catch (e) { toast(e.message, true); }
    }

    function renderSiteNav() {
      document.getElementById('siteCount').textContent = state.sites.length;
      const q = (document.getElementById('siteSearch')?.value || '').toLowerCase();
      const filtered = state.sites.filter(s => s.name.toLowerCase().includes(q));
      const list = document.getElementById('siteNav');
      if (state.sites.length === 0) { list.innerHTML = '<div class="empty-nav">No websites yet</div>'; return; }
      if (filtered.length === 0) { list.innerHTML = '<div class="empty-nav">No matches</div>'; return; }
      list.innerHTML = filtered.map(s => {
        const isPosting = state.currentSiteId === s._id;
        return `
    <button class="nav-item ${state.view === 'site' && state.siteId === s._id ? 'active' : ''} ${isPosting ? 'posting' : ''}" onclick="nav('site','${s._id}')" title="${isPosting ? 'Posting now…' : ''}">
      <span class="avatar" style="background:${hashColor(s.name)}">${initials(s.name)}</span>
      <span class="t">${esc(s.name)}</span>
      ${isPosting ? '<span class="posting-dot"></span>' : ''}
    </button>`;
      }).join('');
    }
    function setActiveNav() {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      if (state.view !== 'site') { const b = document.querySelector(`.nav-item[data-v="${state.view}"]`); if (b) b.classList.add('active'); }
      renderSiteNav();
    }

    async function nav(view, siteId) {
      state.view = view; state.siteId = siteId || null;
      if (view !== 'add-site') state.editingSiteId = null; // leaving the form (without saving) clears edit mode
      setActiveNav();
      if (view === 'site') await loadPosts(siteId);
      else if (view === 'dashboard') await loadPosts();
      render();
    }

    function render() {
      const c = document.getElementById('content');
      if (!state.ready) { c.innerHTML = skeletonView(); return; }
      let html = '';
      if (state.view === 'dashboard') html = dashboardView();
      else if (state.view === 'add-site') html = addSiteView();
      else if (state.view === 'site') html = siteView(state.siteId);
      c.innerHTML = `<div class="view">${html}</div>`;
      attachHandlers();
    }

    function skeletonView() {
      return `<div class="skeleton" style="width:140px;height:14px;margin-bottom:10px;"></div>
    <div class="skeleton" style="width:240px;height:30px;margin-bottom:24px;"></div>
    <div class="stat-grid">
      ${[1, 2, 3, 4].map(() => '<div class="card" style="height:80px;"><div class="skeleton" style="width:50%;height:24px;"></div></div>').join('')}
    </div>`;
    }

    function dashboardView() {
      const counts = { pending: 0, generated: 0, posted: 0, failed: 0 };
      state.posts.forEach(p => counts[p.status]++);
      const scored = state.posts.filter(p => typeof p.seoScore === 'number');
      const avgSeo = scored.length ? Math.round(scored.reduce((s, p) => s + p.seoScore, 0) / scored.length) : null;
      const recent = state.posts.slice(0, 8);
      const busy = !!state.busy['worker'];
      return `
    <div class="eyebrow">Overview</div><h1>Dashboard</h1><p class="sub">Summary of all your websites.</p>
    <section><div class="stat-grid">
      <div class="stat-card" style="--c:var(--accent)"><b>${state.sites.length}</b><span>Websites</span></div>
      <div class="stat-card" style="--c:var(--pending)"><b>${counts.pending}</b><span>Pending</span></div>
      <div class="stat-card" style="--c:var(--success)"><b>${counts.posted}</b><span>Published</span></div>
      <div class="stat-card" style="--c:var(--danger)"><b>${counts.failed}</b><span>Failed</span></div>
      <div class="stat-card" style="--c:${avgSeo === null ? 'var(--pending)' : avgSeo >= 80 ? 'var(--success)' : avgSeo >= 50 ? 'var(--pending)' : 'var(--danger)'}"><b>${avgSeo === null ? '—' : avgSeo + '%'}</b><span>Avg. SEO score</span></div>
    </div></section>

    <section>
      <div class="stitle">Auto-posting</div>
      <p class="shint">Websites are processed one at a time in the background — as soon as one website's daily batch is done, the next one starts right away. This is shared across everyone with dashboard access: whoever presses Start or Stop, everyone sees the same live state. Once started, it keeps running even if you close or reload this tab — it only stops when Stop is pressed, or automatically at midnight for the new day.</p>
      ${!state.paused && state.currentSiteName ? `
      <div class="live-banner">
        <span class="live-dot"></span>
        <span>Posting now to <b>${esc(state.currentSiteName)}</b>…</span>
      </div>` : ''}
      ${state.paused
          ? `<button class="accent" onclick="startPosting()" ${busy ? 'disabled' : ''}>${busy ? spinBtn('Starting…') : '▶ Start posting'}</button>`
          : `<button class="danger-outline" onclick="stopPosting()" ${busy ? 'disabled' : ''}>${busy ? spinBtn('Stopping…') : '⏸ Stop posting'}</button>`}
    </section>

    <section><div class="stitle">Recent activity</div><div class="card">
      ${recent.length === 0 ? '<div class="empty">Nothing yet — add a website and check for new posts.</div>' :
          recent.map(p => {
            const site = state.sites.find(s => s._id === p.siteId);
            return postRow(p, site);
          }).join('')}
    </div></section>`;
    }

    function postRow(p, site) {
      const genBusy = !!state.busy['gen-' + p._id];
      const pubBusy = !!state.busy['pub-' + p._id];
      return `
    <div class="row"><div style="display:flex; gap:10px; flex:1;">
      <span class="avatar" style="background:${hashColor(site?.name || '?')}; flex-shrink:0;">${initials(site?.name)}</span>
      <div style="flex:1;">
        <b>${esc(p.rewrittenTitle || p.sourceTitle)}</b>
        <div class="meta">${esc(site?.name || '')} &nbsp;·&nbsp; ${postDateLabel(p)}</div>
        <div class="actions">
          ${badge(p.status)}
          ${catTag(site)}
          ${seoBadge(p)}
          ${(p.status === 'pending' || p.status === 'failed' || p.status === 'seo_review_required') ? `<button class="small secondary" onclick="genPost('${p._id}')" ${genBusy ? 'disabled' : ''}>${genBusy ? spinBtn('Generating…') : 'Generate'}</button>` : ''}
          ${(p.status === 'generated' || p.status === 'failed') ? `<button class="small" onclick="pubPost('${p._id}')" ${pubBusy ? 'disabled' : ''}>${pubBusy ? spinBtn('Publishing…') : 'Publish'}</button>` : ''}
          ${p.status === 'posted' && p.publishedUrl ? `<a class="link" href="${esc(p.publishedUrl)}" target="_blank" rel="noopener">View post →</a>` : ''}
          ${p.errorMessage ? `<span style="color:var(--danger); font-size:11px;">${esc(p.errorMessage)}</span>` : ''}
        </div>
      </div>
    </div></div>`;
    }

    function addSiteView() {
      const busy = !!state.busy['addSite'];
      const editing = state.editingSiteId ? state.sites.find(s => s._id === state.editingSiteId) : null;
      const v = (val) => esc(val ?? '');
      const targetOptions = editing && editing.targetCategoryId
        ? `<option value="${v(editing.targetCategoryId)}" selected>${v(editing.targetCategoryName || 'Current category')}</option>`
        : '<option value="">Enter your site URL first</option>';
      return `
    <div class="eyebrow">Setup</div><h1>${editing ? 'Edit website' : 'Add a website'}</h1>
    <p class="sub">${editing ? 'Update the details for ' + v(editing.name) + '.' : 'Details for your site, and the site you want to pull content from.'}</p>
    <section><div class="card">
      <form class="g2" id="siteForm">
        <div><label>Site name</label><input id="name" value="${v(editing?.name)}" required /></div>
        <div></div>
        <div class="full"><label>Your WordPress URL</label>
          <div class="inline-btn"><input id="url" value="${v(editing?.url)}" placeholder="https://example.com" required /><button type="button" onclick="loadCats('url','targetCat',this)">Load categories</button></div>
        </div>
        <div><label>WP username</label><input id="username" value="${v(editing?.username)}" required /></div>
        <div><label>Application password${editing ? ' (leave blank to keep current)' : ''}</label><input id="appPassword" type="password" placeholder="${editing ? '••••••••' : ''}" ${editing ? '' : 'required'} /></div>
        <div class="full"><label>Target category (where posts will be published)</label><select id="targetCat">${targetOptions}</select></div>

        <div class="full" style="border-top:1px solid var(--border); margin:6px 0 2px;"></div>
        <div class="full"><label>Source (a category page URL, an RSS feed URL, or just describe the topic)</label>
          <input id="sourceCategoryUrl" value="${v(editing?.sourceCategoryUrl)}" placeholder="https://othersite.com/category/tech  —  or just type: founder stories" required />
          <div class="hint" style="margin-top:6px; color:var(--muted); font-size:12px;">Paste a direct link to a category/listing page (works for any site - WordPress, plain HTML, React, Next.js, Vue) or an RSS feed URL. Or skip the URL entirely and just type what you want, e.g. "founder stories", "AI articles", "Middle East news", "cover story of a brand" - it's turned into a matching Google News search automatically.</div>
        </div>
        <div class="full"><label>Region (only used when Source above is a topic, not a URL)</label>
          <select id="sourceRegion">${REGIONS.map(r => `<option value="${r.code}" ${(editing?.sourceRegion || 'IN') === r.code ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
          <div class="hint" style="margin-top:6px; color:var(--muted); font-size:12px;">Biases results toward that region's publishers and edition of Google News. Pick "Global" for no regional bias.</div>
        </div>
        <div class="full"><label>Keyword filter (optional - only pulls posts with this word in title, e.g. "startup")</label><input id="keywordFilter" value="${v(editing?.keywordFilter)}" placeholder="Leave blank to pull everything" /></div>
        <div class="full"><label>Image theme keyword (optional - e.g. "women" for a women-focused site, biases the fallback image search so generic stock photos match your audience)</label><input id="imageKeyword" value="${v(editing?.imageKeyword)}" placeholder="Leave blank for a generic/neutral fallback" /></div>
        <div class="full"><label>Daily post limit (optional - e.g. 2 means max 2 posts/day on this site)</label><input id="dailyLimit" type="number" min="0" value="${editing?.dailyLimit ? v(editing.dailyLimit) : ''}" placeholder="Leave blank for no limit" /></div>
        <div class="full"><label>SEO plugin on your site (optional)</label>
          <select id="seoPlugin">
            <option value="none" ${(!editing || editing.seoPlugin === 'none' || !editing.seoPlugin) ? 'selected' : ''}>None / not sure</option>
            <option value="yoast" ${editing?.seoPlugin === 'yoast' ? 'selected' : ''}>Yoast SEO</option>
            <option value="rankmath" ${editing?.seoPlugin === 'rankmath' ? 'selected' : ''}>Rank Math</option>
          </select>
          <div class="hint" style="margin-top:6px; color:var(--muted); font-size:12px;">If set, the meta description & focus keyword are also sent to that plugin's fields. Either way, the excerpt and URL slug are always set as a fallback.</div>
        </div>

        <div class="full" style="display:flex; gap:10px;">
          <button type="submit" class="accent" id="submitBtn" ${busy ? 'disabled' : ''}>${busy ? spinBtn(editing ? 'Saving…' : 'Adding website…') : (editing ? 'Save changes' : 'Add website')}</button>
          ${editing ? `<button type="button" class="secondary" onclick="nav('site','${editing._id}')">Cancel</button>` : ''}
        </div>
      </form>
    </div></section>`;
    }

    function siteView(siteId) {
      const site = state.sites.find(s => s._id === siteId);
      if (!site) return `<div class="empty">Website not found. <a class="link" href="javascript:nav('dashboard')">Go to dashboard</a></div>`;
      const fetchBusy = !!state.busy['fetch-' + siteId];

      return `
    <div class="eyebrow">Website</div>
    <h1 style="display:flex; align-items:center; gap:12px;"><span class="avatar" style="width:32px;height:32px;border-radius:9px;font-size:14px;background:${hashColor(site.name)}">${initials(site.name)}</span>${esc(site.name)}</h1>
    <p class="sub">${esc(site.url)}</p>
    <section><div class="card">
      <div class="row"><div><b>Source</b><div class="meta">${esc(site.sourceCategoryUrl)}</div></div></div>
      ${!isUrlLike(site.sourceCategoryUrl) ? `<div class="row"><div><b>Region</b><div class="meta">${esc(REGIONS.find(r => r.code === (site.sourceRegion || 'IN'))?.label || 'India')}</div></div></div>` : ''}
      <div class="row"><div><b>Target category</b><div class="meta">${esc(site.targetCategoryName || 'Uncategorized')}</div></div></div>
      <div class="row"><div><b>Daily limit</b><div class="meta">${site.dailyLimit > 0 ? site.dailyLimit + ' posts/day' : 'No limit'}</div></div></div>
      <div class="row"><div><b>SEO plugin</b><div class="meta">${site.seoPlugin === 'yoast' ? 'Yoast SEO' : site.seoPlugin === 'rankmath' ? 'Rank Math' : 'None / not sure'}</div></div></div>
    </div></section>
    <section>
      <div class="stitle">Posts</div><p class="shint">New posts are checked and published automatically. Use the button below only for an instant check.</p>
      <button class="accent" onclick="checkNew('${site._id}')" style="margin-bottom:14px;" ${fetchBusy ? 'disabled' : ''}>${fetchBusy ? spinBtn('Checking…') : 'Check for new posts'}</button>
      <div class="card">
        ${state.posts.length === 0 ? '<div class="empty">No posts yet — click "Check for new posts".</div>' :
          state.posts.map(p => postRowSimple(p)).join('')}
      </div>
    </section>
    <section style="display:flex; gap:10px;">
      <button class="secondary small" onclick="editSite('${site._id}')">Edit website</button>
      <button class="danger-outline small" onclick="delSite('${site._id}')">Remove this website</button>
    </section>`;
    }

    function postRowSimple(p) {
      const genBusy = !!state.busy['gen-' + p._id];
      const pubBusy = !!state.busy['pub-' + p._id];
      return `
    <div class="row"><div style="flex:1"><b>${esc(p.rewrittenTitle || p.sourceTitle)}</b>
      <div class="meta">${postDateLabel(p)}</div>
      <div class="actions">
        ${badge(p.status)}
        ${seoBadge(p)}
        ${(p.status === 'pending' || p.status === 'failed' || p.status === 'seo_review_required') ? `<button class="small secondary" onclick="genPost('${p._id}')" ${genBusy ? 'disabled' : ''}>${genBusy ? spinBtn('Generating…') : 'Generate'}</button>` : ''}
        ${(p.status === 'generated' || p.status === 'failed') ? `<button class="small" onclick="pubPost('${p._id}')" ${pubBusy ? 'disabled' : ''}>${pubBusy ? spinBtn('Publishing…') : 'Publish'}</button>` : ''}
        ${p.status === 'posted' && p.publishedUrl ? `<a class="link" href="${esc(p.publishedUrl)}" target="_blank" rel="noopener">View post →</a>` : ''}
        ${p.errorMessage ? `<span style="color:var(--danger); font-size:11px;">${esc(p.errorMessage)}</span>` : ''}
      </div>
    </div></div>`;
    }

    async function loadCats(urlFieldId, selectId, btn) {
      const url = document.getElementById(urlFieldId).value.trim();
      const select = document.getElementById(selectId);
      if (!url) return toast('Enter a URL first', true);
      const original = btn.textContent;
      btn.disabled = true; btn.innerHTML = spinBtn('Loading…');
      select.innerHTML = '<option>Loading…</option>';
      try {
        // Always fetch fresh here - this button is a deliberate "refresh" action
        // (e.g. after adding a new category in WP admin), so a stale cached
        // list would silently hide anything added since the last click.
        const result = await api(`/sites/categories?url=${encodeURIComponent(url)}`);
        select.innerHTML = '<option value="">Uncategorized</option>' + result.categories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      } catch (e) { select.innerHTML = '<option value="">Failed to load</option>'; toast(e.message, true); }
      btn.disabled = false; btn.textContent = original;
    }

    function newSite() { state.editingSiteId = null; nav('add-site'); }
    function editSite(id) { state.editingSiteId = id; nav('add-site'); }

    function attachHandlers() {
      const f = document.getElementById('siteForm');
      if (f) f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const editingId = state.editingSiteId;
        const targetSel = document.getElementById('targetCat');
        const appPassword = document.getElementById('appPassword').value.trim();
        const body = {
          name: document.getElementById('name').value.trim(),
          url: document.getElementById('url').value.trim(),
          username: document.getElementById('username').value.trim(),
          sourceCategoryUrl: document.getElementById('sourceCategoryUrl').value.trim(),
          sourceRegion: document.getElementById('sourceRegion').value,
          targetCategoryId: targetSel.value || null,
          targetCategoryName: targetSel.value ? targetSel.options[targetSel.selectedIndex].text : null,
          keywordFilter: document.getElementById('keywordFilter').value.trim() || null,
          imageKeyword: document.getElementById('imageKeyword').value.trim() || null,
          dailyLimit: Number(document.getElementById('dailyLimit').value) || 0,
          seoPlugin: document.getElementById('seoPlugin').value,
        };
        // On edit, an empty password field means "keep the existing one" - only send it if the user typed something.
        if (appPassword || !editingId) body.appPassword = appPassword;

        state.busy['addSite'] = true; render();
        try {
          const site = editingId
            ? await api(`/sites/${editingId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            : await api('/sites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          await loadSites();
          toast(editingId ? 'Website updated' : 'Website added');
          state.busy['addSite'] = false;
          state.editingSiteId = null;
          nav('site', site._id);
        } catch (err) { toast(err.message, true); state.busy['addSite'] = false; render(); }
      });
    }

    async function checkNew(siteId) {
      state.busy['fetch-' + siteId] = true; render();
      try {
        const r = await api(`/posts/fetch/${siteId}`, { method: 'POST' });
        toast(`${r.newPosts} new post(s) found`);
        await loadPosts(siteId);
      } catch (e) { toast(e.message, true); }
      state.busy['fetch-' + siteId] = false; render();
    }
    async function genPost(id) {
      state.busy['gen-' + id] = true; render();
      try {
        await api(`/posts/${id}/generate`, { method: 'POST' });
        toast('Content ready');
        await loadPosts(state.siteId);
      } catch (e) { toast(e.message, true); }
      state.busy['gen-' + id] = false; render();
    }
    async function pubPost(id) {
      state.busy['pub-' + id] = true; render();
      try {
        await api(`/posts/${id}/publish`, { method: 'POST' });
        toast('Published!');
        await loadPosts(state.siteId);
      } catch (e) { toast(e.message, true); }
      state.busy['pub-' + id] = false; render();
    }
    async function delSite(id) {
      if (!confirm('Remove this website?')) return;
      try { await api(`/sites/${id}`, { method: 'DELETE' }); await loadSites(); toast('Website removed'); nav('dashboard'); }
      catch (e) { toast(e.message, true); }
    }

    (async function init() {
      render();
      await Promise.all([loadSites(), loadPosts(), loadStatus()]);
      state.ready = true;
      nav('dashboard');
      setInterval(async () => {
        const tasks = [loadSites(), loadStatus()];
        if (state.view === 'site') tasks.push(loadPosts(state.siteId));
        else if (state.view === 'dashboard') tasks.push(loadPosts());
        await Promise.all(tasks);
        if (state.view !== 'add-site') render();
      }, 10000);
    })();
  </script>
</body>

</html>
